<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nazia Mansoor Portfolio</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />

 
  <link rel="icon" href="assets/favicon.png" type="image/png" />
</head>

<body>

  <div id="carousel1" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      
      <div class="carousel-item active">
        <img src="assets/My portfolio bg.gif" class="d-block w-100" alt="Project 1" />
      </div>
      <div class="carousel-item">
        <img src="assets/My portfolio carosual1.gif" class="d-block w-100" alt="Project 2" />
      </div>
      <div class="carousel-item">
        <img src="assets/My portfolio CAROSUAL2.gif" class="d-block w-100" alt="Project 3" />
      </div>
      <div class="carousel-item">
        <img src="assets/My portfolio carosual no 3.gif" class="d-block w-100" alt="Project 4" />
      </div>
      <div class="carousel-item">
        <img src="assets/My portfolio carosual 4.gif" class="d-block w-100" alt="Project 5" />
      </div>
      <div class="carousel-item">
        <img src="assets/My portfolio carosual no5.gif" class="d-block w-100" alt="Project 6" />
      </div>
    </div>

   
    <button class="carousel-control-prev" type="button" data-bs-target="#carousel1" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carousel1" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
