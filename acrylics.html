<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Acrylic Paintings - Nazia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Great Vibes';
      src: url('https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap') format('truetype');
    }
    body {
        font-family: 'Great Vibes', cursive;
      background-image: url('assets/2nd background.gif');
      background-size: cover;
      background-position: center;
    }
    .section1{
        color: goldenrod;
    }
    .painting-card {
      /* overflow: hidden; */
      border-radius: 10px;
      transition: transform 0.3s ease;
    }
    .painting-card img {
      width: 100%;
      height: 500px;
      object-fit: cover;
      transition: transform 0.4s;
    }
    .painting-card:hover img {
      transform: scale(1.05);
    }
    .footer{
        color:  goldenrod;
    }
  </style>
</head>
<body>


<section class="section1 py-5 bg-dark text-center">
  <div class="container">
    <h1 class="mb-3">My Acrylic Paintings</h1>
    <p class="lead">Here is a collection of my handmade acrylic paintings that reflect my imagination and creativity. Each piece tells a story.</p>
    <a href="index.html" class="btn btn-outline-dark mt-3">← Back to Home</a>
  </div>
</section>


<section class="py-5">
  <div class="container">
    <div class="row g-4">
     
      <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/america painting.jpg" alt="Painting 1">
        </div>
      </div>
    
      <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/dream painting.jpg" alt="Painting 2">
        </div>
      </div>
     
      <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/black face painting.jpg" alt="Painting 3">
        </div>
      </div>
     
      <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/cool and calm forest painting.jpg" alt="Painting 3">
        </div>
      </div>

      <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/kunfayakun painting.jpg" alt="Painting 3">
        </div>
      </div>

       <div class="col-md-4 col-sm-6">
        <div class="painting-card shadow">
          <img src="assets/time never come painting.jpg" alt="Painting 3">
        </div>
      </div>

    </div>
  </div>
</section>


<footer class="footer text-center py-4 bg-dark mt-5">
  <p class="mb-0">&copy; 2025 Nazia's Art Gallery. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
